# Add labels to pull requests based on modified file paths (actions/labeler v5+ format)
rust:
  - changed-files:
      - any-glob-to-any-file:
          - 'src/**/*.rs'
          - 'Cargo.toml'
web:
  - changed-files:
      - any-glob-to-any-file: 'web/**'
scripts:
  - changed-files:
      - any-glob-to-any-file: 'scripts/**'
config:
  - changed-files:
      - any-glob-to-any-file:
          - '.github/workflows/**'
          - 'package.json'
documentation:
  - changed-files:
      - any-glob-to-any-file:
          - 'README.md'
          - 'CONCEPT.md'
