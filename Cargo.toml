[package]
name = "sort_it_now"
version = "1.6.0"
edition = "2024"
license = "LicenseRef-NCSL-1.0"
description = "Physics-aware 3D bin-packing optimization service with interactive visualization"

[dependencies]
axum = "0.8.9"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tower-http = { version = "0.7.1", features = ["cors", "fs"] }
futures = "0.3.34"
tokio-stream = "0.1.19"
rust-embed = "8.14.0"
mime_guess = "2.0.5"
reqwest = { version = "0.13.5", features = ["json", "rustls", "stream"] }
semver = "1.0.28"
tempfile = "3.27.0"
flate2 = "1.1.11"
tar = "0.4.46"
zip = { version = "9.6.1", default-features = false, features = ["deflate"] }
sha2 = "0.11.1"
dotenvy = "0.15.7"
utoipa = { version = "6.0.0", features = ["axum_extras"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.56.0"

[dev-dependencies]
uuid = { version = "1.29.3", features = ["v4"] }
tower = { version = "0.5.3", features = ["util"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
